  <g fill="#665f53" font-size="15"><text x="104" y="310">151 names and numbers</text><text x="104" y="338">Immediate search + filter</text><text x="104" y="366">Fast first render</text><text x="438" y="232">types · stats · abilities</text><text x="438" y="258">sprites · art · cry</text><text x="438" y="474">habitat · growth rate</text><text x="438" y="500">capture rate · flavor text</text><text x="788" y="310">One combined view with</text><text x="788" y="338">artwork, measurements,</text><text x="788" y="366">stats, entries, and audio</text></g></g>
