<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Kanto Pokédex data flow</title><desc id="desc">A local index and two PokéAPI requests combine into the selected Pokémon specimen panel.</desc>
