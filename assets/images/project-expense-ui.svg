<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Expense Tracker desktop interface</title>
  <desc id="desc">A clean desktop dashboard with an expense form, totals, category summary, and transaction table.</desc>
  <rect width="1280" height="720" fill="#e9edf2"/>
  <rect x="54" y="42" width="1172" height="636" rx="18" fill="#f4f6f8" stroke="#cbd5e1"/>
  <circle cx="84" cy="72" r="8" fill="#ff6b6b"/><circle cx="108" cy="72" r="8" fill="#ffd43b"/><circle cx="132" cy="72" r="8" fill="#51cf66"/>
  <text x="92" y="138" fill="#183153" font-family="Arial,sans-serif" font-size="34" font-weight="700">Expense Tracker</text>
  <text x="92" y="169" fill="#667085" font-family="Arial,sans-serif" font-size="16">Log daily spending and see where your money goes.</text>
  <rect x="92" y="200" width="1096" height="108" rx="12" fill="#fff" stroke="#d8dee8"/>
  <g font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#344054">
    <text x="116" y="228">DATE</text><text x="296" y="228">DESCRIPTION</text><text x="602" y="228">CATEGORY</text><text x="818" y="228">AMOUNT</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#475467">
    <rect x="116" y="242" width="154" height="42" rx="6" fill="#fff" stroke="#bfc8d4"/><text x="132" y="268">2026-08-21</text>
    <rect x="296" y="242" width="280" height="42" rx="6" fill="#fff" stroke="#bfc8d4"/><text x="312" y="268">Groceries</text>
    <rect x="602" y="242" width="190" height="42" rx="6" fill="#fff" stroke="#bfc8d4"/><text x="618" y="268">Food</text><text x="760" y="268">⌄</text>
    <rect x="818" y="242" width="150" height="42" rx="6" fill="#fff" stroke="#bfc8d4"/><text x="834" y="268">42.75</text>
    <rect x="990" y="242" width="170" height="42" rx="6" fill="#2563eb"/><text x="1028" y="268" fill="#fff" font-weight="700">Add expense</text>
  </g>
  <rect x="92" y="330" width="272" height="116" rx="12" fill="#fff" stroke="#d8dee8"/>
  <text x="116" y="362" fill="#667085" font-family="Arial,sans-serif" font-size="12" font-weight="700">TOTAL SPENT</text>
  <text x="116" y="410" fill="#087f5b" font-family="Arial,sans-serif" font-size="34" font-weight="700">$286.42</text>
  <rect x="384" y="330" width="804" height="116" rx="12" fill="#fff" stroke="#d8dee8"/>
  <text x="408" y="362" fill="#667085" font-family="Arial,sans-serif" font-size="12" font-weight="700">BY CATEGORY</text>
  <text x="408" y="406" fill="#344054" font-family="Arial,sans-serif" font-size="16">Food: $96.31   •   Transport: $72.00   •   Education: $64.20   •   Other: $53.91</text>
  <text x="92" y="492" fill="#17202a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Transactions</text>
  <rect x="92" y="512" width="1096" height="132" rx="10" fill="#fff" stroke="#d8dee8"/>
  <rect x="92" y="512" width="1096" height="38" rx="10" fill="#edf2f7"/>
  <g font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#344054"><text x="120" y="537">DATE</text><text x="310" y="537">DESCRIPTION</text><text x="710" y="537">CATEGORY</text><text x="1048" y="537">AMOUNT</text></g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#475467"><text x="120" y="580">2026-08-21</text><text x="310" y="580">Groceries</text><text x="710" y="580">Food</text><text x="1052" y="580">$42.75</text><text x="120" y="620">2026-08-20</text><text x="310" y="620">Bus pass</text><text x="710" y="620">Transport</text><text x="1052" y="620">$30.00</text></g>
</svg>
